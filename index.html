<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Lean Coffee Board</title>
	<meta name="description" content="A simple, real-time board for Lean Coffee style meetings. No accounts required.">
	<link rel="stylesheet" href="css/style.css">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E☕%3C/text%3E%3C/svg%3E">
</head>
<body>
	<noscript>
		<main class="landing">
			<div class="landing__hero">
				<h1>JavaScript required</h1>
				<p>Lean Coffee Board needs JavaScript to run.</p>
			</div>
		</main>
		<footer class="site-footer">
			No ads. No login. All free. Source code at
			<a href="https://github.com/pattespatte/lean-coffee-board">GitHub</a>.
		</footer>
	</noscript>

	<!-- Boot screen shown until app.js mounts. -->
	<div id="boot" class="landing">
		<div class="landing__hero">
			<h1>☕ Loading…</h1>
		</div>
	</div>
	<footer class="site-footer">
		No ads. No login. All free. Source code at
		<a href="https://github.com/pattespatte/lean-coffee-board">GitHub</a>.
	</footer>

	<script type="module" src="js/app.js"></script>
</body>
</html>
